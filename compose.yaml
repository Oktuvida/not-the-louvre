# Local Postgres, the only service the app needs outside Cloudflare: images,
# drawings and live updates run on bindings that `wrangler dev` emulates.
# Same image as CI's database job. The port defaults to 55432 so it does not
# collide with another Postgres on the usual 5432.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - '${POSTGRES_PORT:-55432}:5432'
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - ntl-postgres-data:/var/lib/postgresql/data

volumes:
  ntl-postgres-data:
