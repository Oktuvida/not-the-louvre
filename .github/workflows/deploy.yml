name: Quality and deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# A single in-flight run per ref: pushes to main still serialize (so two deploys
# never race), while pull requests get their own lane instead of queueing behind
# a deployment.
concurrency:
  group: quality-and-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Lint, typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SvelteKit 3 needs Node 22.17+, and vitest, vite and wrangler run on Node.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Both web scripts run `svelte-kit sync` first, so `./$types` resolves on a
      # clean checkout.
      - name: Lint
        run: bun run --filter @not-the-louvre/web lint

      - name: Typecheck
        run: bun run --filter @not-the-louvre/web check

      # Integration suites opt in through RUN_INTEGRATION=1 and are skipped
      # here. The SQL contract suite runs against real Postgres in the
      # `database` job below; the media and avatar suites still need the local
      # Supabase stack's Storage and stay a manual release step (AGENTS.md).
      - name: Server unit tests
        run: bun run --filter @not-the-louvre/web test:unit:server

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Chromium for the browser test project
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      # The client project runs the component specs in a headless Chromium. It
      # was staged as non-blocking while EntrySceneController failed on
      # `new WebGLRenderer`; that spec now renders StudioSceneStub instead, the
      # suite is green, and ~4,000 lines of component tests that cannot fail a
      # build are not a gate. A flake here is a bug to fix or one spec to
      # quarantine — not a reason to un-gate all of them again.
      - name: Client component tests
        run: bun run --filter @not-the-louvre/web test:unit:client

  database:
    name: SQL contract and end-to-end tests
    runs-on: ubuntu-latest
    # A plain Postgres stands in for Supabase's: `db:platform-objects` recreates
    # the few Supabase-owned objects the migration history touches (see
    # apps/web/scripts/db/supabase-platform-objects.sql) before migrating.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      # SvelteKit 3 needs Node 22.17+, and vitest, vite and wrangler run on Node.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare the database
        working-directory: apps/web
        run: |
          bun run db:platform-objects
          bun run db:migrate

      # Fork lineage, keyset paging, DB-owned counters, auto-hide and the
      # rate-limit upsert, executed for real instead of through fakes.
      - name: SQL contract suite
        working-directory: apps/web
        run: bun run test:contract

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Chromium for the end-to-end suite
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      # The e2e build swaps object storage for an in-memory store, so Postgres is
      # all it needs; only the realtime demo needs Supabase Realtime.
      - name: End-to-end tests
        working-directory: apps/web
        run: bun run test:e2e --grep-invert @realtime

  deploy:
    name: Build and deploy worker
    needs: [quality, database]
    # Pull requests get the quality job only; they must never touch production.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # GitHub environment "production" can gate this with required reviewers and
    # is where the Cloudflare credentials below are stored.
    environment: production
    steps:
      - uses: actions/checkout@v4

      # SvelteKit 3 needs Node 22.17+, and vitest, vite and wrangler run on Node.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bun run build` runs the SvelteKit adapter-cloudflare build into
      # apps/web/.svelte-kit/cloudflare.
      #
      # SvelteKit's postbuild `analyse` step imports the server modules, and
      # better-auth validates its secret when its instance is constructed at
      # module load. These placeholders only let that import succeed — the real
      # values are Cloudflare Worker secrets read at runtime via
      # `$env/dynamic/private`. DATABASE_URL is not needed: the DB connection is
      # created lazily on first request, not at import.
      - name: Build
        run: bun run build
        env:
          BETTER_AUTH_SECRET: build-time-placeholder-not-used-at-runtime
          ORIGIN: https://build.invalid

      - name: Deploy with Wrangler
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          # The build already ran above; just upload the prebuilt output.
          command: deploy

      # The unit and e2e suites never exercise workerd, so this is the only check
      # that the artifact actually boots on the real runtime — which is why it
      # fails closed: a run with no URL to test has verified nothing. Set the
      # repository variable PRODUCTION_URL (e.g. https://not-the-louvre.art) to
      # smoke-test the custom domain instead of the workers.dev URL wrangler
      # reports; it is required once the Worker stops publishing to workers.dev.
      - name: Smoke-test the deployed worker
        env:
          SMOKE_URL: ${{ vars.PRODUCTION_URL || steps.deploy.outputs.deployment-url }}
        run: |
          if [ -z "$SMOKE_URL" ]; then
            echo "::error::No PRODUCTION_URL repository variable and wrangler reported no deployment URL; the deploy cannot be verified."
            exit 1
          fi

          for attempt in 1 2 3 4 5; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$SMOKE_URL/" || echo 000)
            echo "attempt ${attempt}: GET ${SMOKE_URL}/ -> ${status}"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 10
          done

          echo "::error::Deployed worker never answered 200 at ${SMOKE_URL}/"
          exit 1
